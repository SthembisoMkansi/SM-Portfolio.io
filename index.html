<!-- ===== AI AGENT CHATBOT ===== -->
<style>
    /* Chat Widget */
    .chat-widget {
        position: fixed;
        bottom: 100px;
        right: 20px;
        z-index: 9999;
        font-family: 'Inter', sans-serif;
    }
    .chat-toggle {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #8b5cf6, #d946ef);
        border: none;
        color: #fff;
        font-size: 28px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(99,102,241,0.4);
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-left: auto;
    }
    .chat-toggle:hover {
        transform: scale(1.1);
        box-shadow: 0 12px 32px rgba(99,102,241,0.6);
    }
    .chat-window {
        display: none;
        width: 360px;
        max-width: 90vw;
        background: var(--bg-card, #1a1a1a);
        border-radius: 20px;
        border: 1px solid var(--border-light, rgba(255,255,255,0.08));
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        margin-bottom: 16px;
        overflow: hidden;
        backdrop-filter: blur(20px);
        flex-direction: column;
        max-height: 500px;
        transition: all 0.3s;
    }
    .chat-window.open {
        display: flex;
    }
    .chat-header {
        padding: 16px 20px;
        background: rgba(99,102,241,0.15);
        border-bottom: 1px solid var(--border-light);
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .chat-header .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #d946ef);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: #fff;
    }
    .chat-header .info h4 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary, #fff);
    }
    .chat-header .info p {
        margin: 0;
        font-size: 12px;
        color: var(--text-muted, #6b6b6b);
    }
    .chat-header .close-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 20px;
        cursor: pointer;
        margin-left: auto;
        padding: 0 4px;
    }
    .chat-body {
        flex: 1;
        padding: 16px 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 320px;
        background: var(--bg-primary, #0a0a0a);
    }
    .chat-body .message {
        max-width: 85%;
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.5;
        animation: fadeInUp 0.3s ease;
    }
    .chat-body .message.bot {
        background: var(--bg-elevated, #2a2a2a);
        color: var(--text-secondary, #d0d0d0);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }
    .chat-body .message.user {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #fff;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }
    .chat-body .typing-indicator {
        display: none;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        background: var(--bg-elevated, #2a2a2a);
        border-radius: 20px;
        align-self: flex-start;
    }
    .chat-body .typing-indicator span {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8b5cf6;
        animation: typingBounce 1.2s infinite;
    }
    .chat-body .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .chat-body .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-6px); }
    }
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .chat-footer {
        padding: 12px 16px;
        border-top: 1px solid var(--border-light);
        display: flex;
        gap: 8px;
        background: var(--bg-card);
    }
    .chat-footer input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid var(--border-light);
        border-radius: 30px;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-size: 14px;
        outline: none;
        transition: border 0.3s;
    }
    .chat-footer input:focus {
        border-color: #6366f1;
    }
    .chat-footer input::placeholder {
        color: var(--text-muted);
    }
    .chat-footer button {
        padding: 10px 18px;
        border: none;
        border-radius: 30px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.3s;
        font-size: 14px;
    }
    .chat-footer button:hover {
        opacity: 0.85;
    }
    .quick-replies {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 0 16px 10px 16px;
        background: var(--bg-primary);
        border-top: 1px solid var(--border-light);
    }
    .quick-replies button {
        background: rgba(99,102,241,0.15);
        border: 1px solid rgba(99,102,241,0.3);
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 12px;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.2s;
    }
    .quick-replies button:hover {
        background: rgba(99,102,241,0.3);
        color: #fff;
    }
    @media (max-width: 480px) {
        .chat-window {
            width: 100%;
            max-width: 100vw;
            right: 0;
            bottom: 0;
            border-radius: 20px 20px 0 0;
            max-height: 80vh;
        }
        .chat-widget {
            bottom: 20px;
            right: 16px;
        }
        .chat-toggle {
            width: 56px;
            height: 56px;
            font-size: 24px;
        }
    }
</style>

<div class="chat-widget">
    <!-- Chat Window -->
    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <div class="avatar">🤖</div>
            <div class="info">
                <h4>AI Career Assistant</h4>
                <p>Ask me about Sthembiso</p>
            </div>
            <button class="close-btn" id="closeChat">✕</button>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="message bot">👋 Hello! I'm the AI assistant for Sthembiso's portfolio. Ask me about his skills, experience, certifications, or projects!</div>
            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>
        </div>
        <div class="quick-replies" id="quickReplies">
            <button data-question="skills">💡 Skills</button>
            <button data-question="experience">💼 Experience</button>
            <button data-question="certificates">🎓 Certificates</button>
            <button data-question="projects">🚀 Projects</button>
            <button data-question="education">📚 Education</button>
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="Ask a question..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>
    <!-- Toggle Button -->
    <button class="chat-toggle" id="chatToggle" aria-label="Open AI Chat">
        <span id="toggleIcon">💬</span>
    </button>
</div>

<script>
    (function() {
        // ========== KNOWLEDGE BASE ==========
        const knowledge = {
            // Skills
            skills: "Sthembiso has expertise in:\n• Business Analysis: Requirements elicitation, gap analysis, BPMN, UML, process mapping.\n• Data & AI: Machine Learning, NLP, LLM deployment (Azure ML), Python (PyTorch), Power BI, Tableau.\n• Development: Full-stack (JS, Node.JS, Python, HTML/CSS), databases (SQL, MySQL, Oracle).\n• Testing: UAT, SIT, Selenium, test case management, defect tracking (Jira).\n• Project Management: Agile (Scrum/Kanban), Waterfall, risk management, stakeholder communication.",
            experience: "Sthembiso has 7+ years of IT experience. He is currently an IT Enabler at Edu Nova (Nov 2025–present). Previously he worked as a Test Analyst at African Bank (Aug 2023–May 2024), Junior Business Analyst at Absa Bank (Jul 2021–Nov 2022), IT Technical Consultant at MN Mkansi Inc (Feb 2019–Mar 2021), and Web Developer at Kulani ICT Solutions (Feb 2018–Nov 2018). He has delivered measurable impacts: 25% faster ETL, 98% defect detection, 15% improved AI predictions, and 40% website load time improvements.",
            certificates: "Sthembiso holds:\n• Microsoft Certified: Azure AI Engineer Associate (Earned May 2022, expires May 2027)\n• Microsoft Certified: Azure AI Fundamentals (Earned Apr 2022)\n• Project Management Certificate from the National School of Government (Mar 2026) – part of the SMS Essentials Programme for middle/senior managers.",
            projects: "Notable side projects:\n• Web Design & Development (Freelance, Aug–Oct 2024) – built responsive sites with HTML, CSS, JS, WordPress, improved SEO.\n• Website Upgrade & Optimization (Mar–May 2025) – upgraded legacy sites to modern frameworks, achieved 40% load time improvement.\n• ICT Lab Proposal Coordinator (Jan 2026–present) – developed a ZAR 500k proposal for a 30-workstation computer lab at Khulanolwazi Primary School, secured stakeholder buy-in.",
            education: "Sthembiso holds a Bachelor of Information Technology in Business Systems from RoseBank College IIE (2016–2018) and a Diploma in Business Analysis from Gijima Training Institute (2021–2022).",
            // Additional generic
            hello: "Hi there! I'm here to help you learn about Sthembiso's background. You can ask about his skills, experience, certifications, projects, or education.",
            default: "I'm not sure about that. Please ask about skills, experience, certificates, projects, or education. Or click one of the quick reply buttons!"
        };

        // ========== ELEMENTS ==========
        const chatWindow = document.getElementById('chatWindow');
        const chatToggle = document.getElementById('chatToggle');
        const closeChat = document.getElementById('closeChat');
        const chatBody = document.getElementById('chatBody');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const quickReplyBtns = document.querySelectorAll('.quick-replies button');

        let isOpen = false;
        let isProcessing = false;

        // ========== TOGGLE CHAT ==========
        function toggleChat() {
            isOpen = !isOpen;
            chatWindow.classList.toggle('open', isOpen);
            const icon = document.getElementById('toggleIcon');
            icon.textContent = isOpen ? '✕' : '💬';
            if (isOpen) {
                chatInput.focus();
                // Auto-scroll to bottom
                setTimeout(scrollToBottom, 100);
            }
        }

        chatToggle.addEventListener('click', toggleChat);
        closeChat.addEventListener('click', toggleChat);

        // ========== SCROLL TO BOTTOM ==========
        function scrollToBottom() {
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        // ========== ADD MESSAGE ==========
        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            // Replace newlines with <br>
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            // Insert before typing indicator
            chatBody.insertBefore(msgDiv, typingIndicator);
            scrollToBottom();
        }

        // ========== SHOW TYPING ==========
        function showTyping(show) {
            typingIndicator.style.display = show ? 'flex' : 'none';
            if (show) scrollToBottom();
        }

        // ========== GET RESPONSE ==========
        function getResponse(input) {
            const lower = input.toLowerCase();
            // Check for keywords
            if (lower.includes('skill') || lower.includes('tool') || lower.includes('technology')) {
                return knowledge.skills;
            } else if (lower.includes('experience') || lower.includes('job') || lower.includes('work') || lower.includes('role') || lower.includes('position')) {
                return knowledge.experience;
            } else if (lower.includes('certif') || lower.includes('credential') || lower.includes('azure') || lower.includes('project management')) {
                return knowledge.certificates;
            } else if (lower.includes('project') || lower.includes('side') || lower.includes('freelance') || lower.includes('volunteer')) {
                return knowledge.projects;
            } else if (lower.includes('edu') || lower.includes('degree') || lower.includes('college') || lower.includes('university') || lower.includes('diploma')) {
                return knowledge.education;
            } else if (lower.includes('hi') || lower.includes('hello') || lower.includes('hey')) {
                return knowledge.hello;
            } else {
                return knowledge.default;
            }
        }

        // ========== PROCESS USER INPUT ==========
        function processUserInput(input) {
            if (!input.trim()) return;
            if (isProcessing) return;

            // Add user message
            addMessage(input.trim(), 'user');
            chatInput.value = '';
            isProcessing = true;
            showTyping(true);

            // Simulate thinking delay
            setTimeout(() => {
                const response = getResponse(input);
                addMessage(response, 'bot');
                showTyping(false);
                isProcessing = false;
                // Show quick replies again (they are always visible)
            }, 600 + Math.random() * 400);
        }

        // ========== EVENT LISTENERS ==========
        sendBtn.addEventListener('click', () => {
            processUserInput(chatInput.value);
        });

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                processUserInput(chatInput.value);
            }
        });

        quickReplyBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const question = btn.getAttribute('data-question');
                // Map to a friendly prompt
                let prompt = '';
                switch(question) {
                    case 'skills': prompt = 'Tell me about your skills.'; break;
                    case 'experience': prompt = 'What is your work experience?'; break;
                    case 'certificates': prompt = 'What certifications do you have?'; break;
                    case 'projects': prompt = 'What projects have you worked on?'; break;
                    case 'education': prompt = 'What is your education background?'; break;
                    default: prompt = question;
                }
                chatInput.value = prompt;
                processUserInput(prompt);
            });
        });

        // ========== INITIAL GREETING (if window opens) ==========
        // Add a welcome after a short delay if chat opens first time?
        // Already present in HTML.

        // ========== CLOSE CHAT ON OUTSIDE CLICK (optional) ==========
        document.addEventListener('click', (e) => {
            if (isOpen && !chatWindow.contains(e.target) && e.target !== chatToggle && !chatToggle.contains(e.target)) {
                // Do not close automatically to avoid annoyance
            }
        });

        console.log('🤖 AI Career Assistant loaded!');
    })();
</script>
<!-- ===== END AI AGENT ===== -->
